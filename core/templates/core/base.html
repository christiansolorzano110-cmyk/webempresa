<!DOCTYPE html>
<html lang="es">
<head>
  {% load static %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>{% block title %}La Cafetería{% endblock %}</title>

  <!-- Fuentes y Bootstrap -->
  <link href="https://fonts.googleapis.com/css?family=Raleway:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Lora:400,400i,700,700i" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Encabezado / Título del Negocio -->
  <header class="text-center py-5 bg-dark text-white">
    <h1 class="display-4">La Cafetería</h1>
    <span class="text-uppercase text-secondary">Café artesanal y repostería</span>
  </header>

  <!-- Navegación común -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-secondary sticky-top">
    <div class="container">
      <div class="navbar-nav mx-auto">
        <a class="nav-link" href="/">Inicio</a>
        <a class="nav-link" href="/services/">Servicios</a>
        <a class="nav-link active" href="/blog/">Blog</a>
      </div>
    </div>
  </nav>

  <!-- Bloque dinámico donde se inyectará cada vista -->
  <main class="container my-5">
    {% block content %}
    {% endblock %}
  </main>

  <!-- Pie de página -->
  <footer class="footer text-center py-4 bg-dark text-white-50">
    <div class="container">
      <small>Copyright &copy; La Cafetería 2026</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
